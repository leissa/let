name: macos

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: appleclang ${{matrix.build-type}}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          CC=clang CXX=clang++
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build -v

      - name: Test
        run: ctest --test-dir ${{github.workspace}}/build --output-on-failure

  # Apple clang has no LeakSanitizer; leak checking runs on Linux (LSan + Valgrind).
  sanitize:
    name: ASan+UBSan
    runs-on: macos-latest
    env:
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:log_path=/tmp/sanitizer
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:report_error_type=1:log_path=/tmp/sanitizer

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          CC=clang CXX=clang++
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build
        run: cmake --build ${{github.workspace}}/build -v

      - name: Test
        run: ctest --test-dir ${{github.workspace}}/build --output-on-failure

      # See the same step in linux.yml: the error tests exit non-zero by design, so a sanitizer
      # abort inside one of them is only visible through log_path.
      - name: Check for sanitizer reports
        if: always()
        run: |
          shopt -s nullglob
          reports=(/tmp/sanitizer.*)
          if (( ${#reports[@]} != 0 )); then
              cat "${reports[@]}"
              exit 1
          fi
