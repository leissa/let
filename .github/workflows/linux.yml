name: linux

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{matrix.compiler.name}} ${{matrix.build-type}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # clang uses libstdc++ as its standard library, so g++-14 is installed in both cases.
        compiler:
          - {name: gcc-14, cc: gcc-14, cxx: g++-14,  apt: g++-14}
          - {name: clang,  cc: clang,  cxx: clang++, apt: clang g++-14}
        build-type: [Debug, Release]

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain, Ninja, and Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build valgrind ${{matrix.compiler.apt}}

      - name: Configure
        run: >
          CC=${{matrix.compiler.cc}} CXX=${{matrix.compiler.cxx}}
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}

      - name: Build
        run: cmake --build ${{github.workspace}}/build -v

      - name: Test
        run: bash test/run_tests.sh ${{github.workspace}}/build/bin/let

      # Valgrind covers every test, not just eval.let -- the interpreter must not leak on its
      # error paths either. Those tests exit non-zero by design, so --error-exitcode cannot be the
      # verdict; the log is. Demanding a "0 errors" summary rather than testing for errors also
      # fails closed if Valgrind dies before it can report anything.
      - name: Test with Valgrind
        run: |
          log=${RUNNER_TEMP}/valgrind.log
          status=0
          check() {
              valgrind --leak-check=full --error-exitcode=1 --log-file="$log" \
                       ${{github.workspace}}/build/bin/let "$@" > /dev/null 2>&1 || true
              if ! grep -q "ERROR SUMMARY: 0 errors" "$log"; then
                  echo "::error::Valgrind reported errors for: let $*"
                  cat "$log"
                  status=1
              fi
          }
          for f in test/*.let;       do check "$f" -e; done
          for f in test/error/*.let; do check "$f";    done
          exit $status

  sanitize:
    name: ASan+LSan+UBSan
    runs-on: ubuntu-latest
    env:
      ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_init_order=1:detect_leaks=1:log_path=/tmp/sanitizer
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:report_error_type=1:log_path=/tmp/sanitizer

    steps:
      - name: Clone recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build clang g++-14

      - name: Configure
        run: >
          CC=clang CXX=clang++
          cmake -S ${{github.workspace}} -B ${{github.workspace}}/build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,leak,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,leak,undefined"

      - name: Build
        run: cmake --build ${{github.workspace}}/build -v

      - name: Test
        run: bash test/run_tests.sh ${{github.workspace}}/build/bin/let

      # -fno-sanitize-recover=all aborts on the first report, but the error tests are *expected* to
      # exit non-zero and their .err patterns still match, so an abort in one of them would pass
      # unnoticed. log_path (see the job env) routes every report to a file instead of stderr; the
      # existence of such a file is the actual verdict.
      - name: Check for sanitizer reports
        if: always()
        run: |
          shopt -s nullglob
          reports=(/tmp/sanitizer.*)
          if (( ${#reports[@]} != 0 )); then
              cat "${reports[@]}"
              exit 1
          fi
